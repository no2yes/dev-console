<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발자콘솔</title>
<style>
  /* 모바일 브라우저가 "글이 많아지면 자동으로 확대"하는 기능을 꺼서,
     항목을 여러 개 펼쳐도 글씨 크기가 제멋대로 커지지 않게 합니다. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; }
  h1 { font-size: 18px; margin: 0 0 16px; }

  /* 프로젝트별 필터 버튼들 */
  /* 필터 버튼 줄과 선택삭제 도구모음을 한 줄에 나란히 배치하는 바깥 껍데기입니다.
     양 끝으로 벌려서, 선택삭제 도구모음이 나타나도 다른 내용이 아래로
     밀리지 않고 같은 줄 오른쪽에 얹히게 합니다. */
  #toolbarRow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  #filterBar { display: flex; gap: 8px; flex-wrap: wrap; }

  /* 선택 삭제 도구모음: 1개 이상 체크됐을 때만 나타납니다 */
  #selectionBar {
    display: none; align-items: center; gap: 10px;
    background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 10px;
    padding: 6px 10px; font-size: 13px; color: #991B1B;
  }
  #deleteSelectedBtn {
    padding: 6px 14px; border-radius: 8px; border: none; background: #DC2626;
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; -webkit-appearance: none; appearance: none;
  }
  .feedback-checkbox-select { flex-shrink: 0; width: 16px; height: 16px; cursor: pointer; }
  .filter-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #ccc; background: #fff; color: #1F2A24; font-size: 13px; cursor: pointer; font-family: inherit; -webkit-appearance: none; appearance: none; }
  .filter-btn.active { background: #2F6F5E; border-color: #2F6F5E; color: #fff; font-weight: 600; }

  /* 한 줄 목록 레이아웃: 프로젝트 태그 - 내용 - 시간 - 버튼들이 가로로
     나란히 배치됩니다. 내용이 길면 "..."으로 줄여서 한 줄을 유지합니다. */
  .feedback-card {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid #eee; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 6px;
  }
  .feedback-card.resolved { opacity: 0.5; }
  .project-tag {
    flex-shrink: 0; padding: 3px 10px; border-radius: 999px;
    background: #EAF2EE; color: #2F6F5E; font-size: 12px; font-weight: 600;
  }
  .feedback-message {
    flex: 1; min-width: 0; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .feedback-message { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .ai-badge { flex-shrink: 0; font-size: 13px; }
  .message-detail {
    background: #FAF9F5; border: 1px solid #eee; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 6px; font-size: 14px;
    line-height: 1.5; white-space: pre-wrap; display: none;
  }
  .feedback-time { flex-shrink: 0; font-size: 12px; color: #999; }
  .feedback-screenshot { max-width: 100%; border-radius: 8px; border: 1px solid #eee; margin-bottom: 10px; display: block; }

  .screenshot-loading { font-size: 12px; color: #999; padding: 8px 0; }
  /* 버튼 3개(캡처/복사/해결)의 너비를 고정해서, 여러 줄에 걸쳐 나열됐을 때
     세로로도 정렬된 열처럼 보이게 합니다. */
  .feedback-actions { flex-shrink: 0; display: flex; gap: 6px; }
  .feedback-actions button {
    width: 76px; box-sizing: border-box;
    padding: 6px 0; border-radius: 8px; border: 1px solid #ccc;
    background: #fff; font-size: 12px; cursor: pointer;
    font-family: inherit; -webkit-appearance: none; appearance: none;
    white-space: nowrap; text-align: center;
  }
  /* 모바일(is-mobile 클래스가 body에 붙었을 때)에서만 버튼을 더 좁게 */
  body.is-mobile .feedback-actions button { width: 48px; }

  /* 모바일이면서 "세로화면"일 때만: 공간이 부족해 제목 자체가 안 보이는
     문제를 막기 위해, 캡처 버튼만 남기고 복사·해결 버튼(그리고 캡처가
     없을 때의 빈 자리)을 숨깁니다. 화면을 돌리면(가로↔세로) 자동으로
     다시 나타나거나 사라집니다(자바스크립트 없이 CSS만으로 처리). */
  @media (orientation: portrait) {
    body.is-mobile .copy-btn,
    body.is-mobile .resolve-btn,
    body.is-mobile .feedback-actions > span {
      display: none;
    }
  }
  .resolve-btn.is-resolved { background: #2F6F5E; color: #fff; border-color: #2F6F5E; }
  #empty { font-size: 13px; color: #999; margin-top: 20px; text-align: center; }

  /* 자료를 불러오는 동안 화면 전체를 덮는 로딩 표시입니다 */
  #pageLoadingOverlay {
    position: fixed; inset: 0; background: #F7F5EF;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 900;
  }
  #pageLoadingOverlay .spinner {
    width: 48px; height: 48px; border: 5px solid rgba(47, 111, 94, 0.15);
    border-top-color: #2F6F5E; border-radius: 50%; animation: plspin 0.8s linear infinite;
  }
  @keyframes plspin { to { transform: rotate(360deg); } }
  #pageLoadingOverlay .loading-text { margin-top: 14px; font-size: 15px; font-weight: 600; color: #1F2A24; }
</style>
</head>
<body>
  <h1>개발자콘솔 — 피드백 목록</h1>

  <!-- 자료를 불러오는 동안 화면 전체를 덮는 로딩 표시입니다. 다 불러오면
       자바스크립트에서 숨깁니다. -->
  <div id="pageLoadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">피드백을 불러오고 있어요...</div>
  </div>

  <div id="toolbarRow">
    <div id="filterBar"></div>

    <!-- 체크박스를 하나라도 선택하면 나타나는 삭제 도구모음. 필터 버튼과
         같은 줄(toolbarRow) 안에 있어서, 나타나도 아래 목록이 밀리지 않습니다. -->
    <div id="selectionBar">
      <span id="selectionCount">0개 선택됨</span>
      <button type="button" id="deleteSelectedBtn">선택 삭제</button>
    </div>
  </div>

  <div id="list"></div>
  <div id="empty">불러오는 중...</div>
  <button type="button" id="loadMoreBtn" style="display:none; width:100%; padding:12px; margin-top:8px; border-radius:10px; border:1px solid #ccc; background:#fff; font-size:14px; color:#555; cursor:pointer; font-family:inherit; -webkit-appearance:none; appearance:none;">더 보기</button>

  <script>
    // ▼▼ 개발자콘솔 GAS 웹 앱의 실제 exec 주소로 바꿔주세요 ▼▼
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyaPRuDlrSFI9pEkC7lluAGI3ql-pnBRuLRGGt5L4ZHgXabZYau251ClzYyHPahRgZB/exec';

    var allFeedback = [];
    var currentFilter = '전체';

    // 공간이 좁은 모바일에서만 줄임말·짧은 정보를 쓰고, PC에서는 전체
    // 정보를 그대로 보여줍니다.
    var isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    if (isMobileDevice) {
      document.body.classList.add('is-mobile');
    }

    // 프로젝트별 줄임말입니다(모바일 전용). 새 프로젝트를 시작할 때마다
    // 여기에 한 줄씩 추가해주세요(같은 규칙을 "Apps Script 개발 노하우
    // 모음" 체크리스트에도 남겨뒀습니다). 매핑에 없는 프로젝트는 자동으로
    // 앞 2글자만 씁니다.
    var PROJECT_ABBR = {
      '보건실 관리시스템': '보건',
      '실습실 운영시스템': '실습'
    };
    function getProjectLabel(fullName) {
      if (!isMobileDevice) return fullName; // PC는 항상 전체 이름
      if (PROJECT_ABBR[fullName]) return PROJECT_ABBR[fullName];
      return fullName.length > 2 ? fullName.slice(0, 2) : fullName;
    }

    // 모바일에서만 "09.24 13:00" 형태로 짧게 표시합니다. PC에서는 연도가
    // 포함된 전체 날짜를 그대로 보여줍니다. 복사 버튼으로 복사할 때는
    // (기기와 무관하게, 맥락이 중요하니) 항상 전체 날짜를 씁니다.
    function formatTimeLabel(dateVal) {
      var d = new Date(dateVal);
      if (!isMobileDevice) return d.toLocaleString('ko-KR');
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      var hh = String(d.getHours()).padStart(2, '0');
      var mi = String(d.getMinutes()).padStart(2, '0');
      return mm + '.' + dd + ' ' + hh + ':' + mi;
    }
    var selectedRows = new Set(); // 체크된 항목들의 rowIndex를 담아둡니다.

    function updateSelectionBar() {
      var bar = document.getElementById('selectionBar');
      if (selectedRows.size > 0) {
        bar.style.display = 'flex';
        document.getElementById('selectionCount').textContent = selectedRows.size + '개 선택됨';
      } else {
        bar.style.display = 'none';
      }
    }

    function render() {
      var listEl = document.getElementById('list');
      var emptyEl = document.getElementById('empty');
      listEl.innerHTML = '';

      var filtered = currentFilter === '전체'
        ? allFeedback
        : allFeedback.filter(function (f) { return f.project === currentFilter; });

      if (filtered.length === 0) {
        emptyEl.textContent = '해당하는 피드백이 없습니다.';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      filtered.forEach(function (item) {
        var isResolved = item.status === '해결';
        var card = document.createElement('div');
        card.className = 'feedback-card' + (isResolved ? ' resolved' : '');

        // 화면엔 기기에 맞게(PC=전체, 모바일=짧게), 복사할 때는 항상 전체 날짜로 씁니다.
        var timeLabel = formatTimeLabel(item.time);
        var fullTimeStr = new Date(item.time).toLocaleString('ko-KR');

        var copyText = '[' + item.project + '] ' + fullTimeStr + '\n' + item.message +
          (item.screenshot ? '\n캡처: ' + item.screenshot : '') +
          (item.page ? '\n페이지: ' + item.page : '');

        var isChecked = selectedRows.has(item.rowIndex);
        // AI가 정상적으로 요약했으면 ✨, 실패해서 글자수로만 잘랐으면 ✂️,
        // 둘 다 아니면(아직 요약이 안 끝났거나 예전 데이터) 표시하지 않습니다.
        var aiBadge = '';
        if (item.aiUsed === 'AI') {
          aiBadge = '<span class="ai-badge" title="AI가 요약했어요">✨</span>';
        } else if (item.aiUsed === '수동') {
          aiBadge = '<span class="ai-badge" title="AI 요약 실패 — 글자수로 잘랐어요">✂️</span>';
        }
        var placeholderWidth = isMobileDevice ? '48px' : '76px';
        var screenshotBtnText = isMobileDevice ? '캡처' : '🖼 캡처';
        var copyBtnText = isMobileDevice ? '복사' : '📋 복사';
        var resolveBtnText = isResolved
          ? (isMobileDevice ? '해결됨' : '✓ 해결됨')
          : '해결';

        var html = '<input type="checkbox" class="feedback-checkbox-select"' + (isChecked ? ' checked' : '') + '>' +
          '<span class="project-tag" title="' + item.project + '">' + getProjectLabel(item.project) + '</span>' +
          aiBadge +
          '<span class="feedback-message"></span>' +
          '<span class="feedback-time" title="' + fullTimeStr + '">' + timeLabel + '</span>' +
          '<div class="feedback-actions">' +
          (item.screenshot
            ? '<button type="button" class="screenshot-toggle-btn" data-fileid="' + item.screenshot + '">' + screenshotBtnText + '</button>'
            : '<span style="width:' + placeholderWidth + ';"></span>') +
          '<button type="button" class="copy-btn">' + copyBtnText + '</button>' +
          '<button type="button" class="resolve-btn' + (isResolved ? ' is-resolved' : '') + '">' + resolveBtnText + '</button>' +
          '</div>';

        card.innerHTML = html;

        card.querySelector('.feedback-checkbox-select').addEventListener('click', function (e) {
          e.stopPropagation(); // 체크박스 클릭이 카드 안 다른 클릭(제목 펼치기 등)으로 번지지 않게 합니다.
          if (e.target.checked) {
            selectedRows.add(item.rowIndex);
          } else {
            selectedRows.delete(item.rowIndex);
          }
          updateSelectionBar();
        });
        // 한 줄 목록에는 AI가 요약한 짧은 제목(title)을 보여주고, 원본 전체
        // 내용은 title 속성(마우스 올리면 뜨는 말풍선)으로 남겨둡니다.
        var messageEl = card.querySelector('.feedback-message');
        messageEl.textContent = item.title || item.message;
        messageEl.addEventListener('click', function () {
          var isOpen = messageDetailRow.style.display === 'block';
          messageDetailRow.style.display = isOpen ? 'none' : 'block';
        });

        card.querySelector('.copy-btn').addEventListener('click', function () {
          navigator.clipboard.writeText(copyText).then(function () {
            var btn = card.querySelector('.copy-btn');
            var original = btn.textContent;
            btn.textContent = '복사됨!';
            setTimeout(function () { btn.textContent = original; }, 1200);
          });
        });

        // 한 줄 레이아웃이라, 캡처 이미지와 전체 내용이 펼쳐질 자리를
        // 카드 바로 아래에 따로 만들어서 필요할 때만 보여줍니다.
        if (item.screenshot) {
          var screenshotRow = document.createElement('div');
          screenshotRow.className = 'screenshot-container';
          screenshotRow.style.marginBottom = '6px';
          card.insertAdjacentElement('afterend', screenshotRow);
        }

        var messageDetailRow = document.createElement('div');
        messageDetailRow.className = 'message-detail';
        messageDetailRow.textContent = item.message; // textContent라 HTML 태그 걱정 없이 안전합니다.
        card.insertAdjacentElement('afterend', messageDetailRow);

        card.querySelector('.resolve-btn').addEventListener('click', function () {
          var btn = card.querySelector('.resolve-btn');
          var originalText = btn.textContent;
          // 누른 즉시 "처리 중..."으로 바꾸고, 다시 못 누르게 잠급니다.
          // 이렇게 하면 서버 응답이 늦어도 "눌렸다"는 게 바로 느껴집니다.
          btn.textContent = '처리 중...';
          btn.disabled = true;

          var newResolved = !isResolved;
          fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ type: 'resolve', rowIndex: item.rowIndex, resolved: newResolved })
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data && data.ok) {
                item.status = newResolved ? '해결' : '미해결';
                render(); // 성공하면 목록 전체가 다시 그려지면서 버튼도 정상 상태로 돌아갑니다.
              } else {
                // 실패했으면 원래 글씨로 되돌리고 다시 누를 수 있게 합니다.
                btn.textContent = originalText;
                btn.disabled = false;
                alert('처리에 실패했습니다: ' + (data && data.error ? data.error : '알 수 없는 오류'));
              }
            })
            .catch(function () {
              btn.textContent = originalText;
              btn.disabled = false;
              alert('처리 중 오류가 발생했습니다.');
            });
        });

        // "🖼 캡처 보기" 버튼은 처음 눌렀을 때만 실제 이미지를 불러옵니다.
        // 두 번째 클릭부터는 이미 불러온 이미지를 접었다 펼치기만 합니다
        // (다시 불러오지 않아서, 클릭할 때마다 매번 로딩이 걸리지 않습니다).
        var toggleBtn = card.querySelector('.screenshot-toggle-btn');
        if (toggleBtn) {
          var screenshotLoaded = false;
          var container = screenshotRow;
          toggleBtn.addEventListener('click', function () {
            var isOpen = container.style.display === 'block';
            if (isOpen) {
              container.style.display = 'none';
              toggleBtn.textContent = isMobileDevice ? '캡처' : '🖼 캡처';
              return;
            }

            container.style.display = 'block';
            toggleBtn.textContent = isMobileDevice ? '접기' : '🖼 접기';

            if (!screenshotLoaded) {
              // 캡처 원본 자체가 이미 화면의 60% 크기로 고정되어 저장되기 때문에,
              // 더 큰 사이즈를 요청해도 원본보다 커질 수 없습니다. 그래서 "더 크게
              // 보기"용 두 번째 클릭은 의미가 없어 없앴고, 처음 볼 때부터 바로
              // 이 용도로 쓸 수 있는 가장 큰 사이즈(w1600)로 한 번만 보여줍니다.
              var fileId = toggleBtn.getAttribute('data-fileid');
              var imgSrc = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1600';
              container.innerHTML = '<div class="screenshot-loading">불러오는 중...</div>';

              var img = new Image();
              img.onload = function () {
                container.innerHTML = '<img class="feedback-screenshot" src="' + imgSrc + '">';
              };
              img.onerror = function () {
                container.innerHTML = '<div class="screenshot-loading">이미지를 불러오지 못했습니다.</div>';
              };
              img.src = imgSrc;

              screenshotLoaded = true;
            }
          });
        }

        listEl.appendChild(card);
        if (item.screenshot) {
          listEl.appendChild(screenshotRow);
        }
        listEl.appendChild(messageDetailRow);
      });
    }

    function renderFilterBar() {
      var projects = ['전체'];
      allFeedback.forEach(function (item) {
        if (projects.indexOf(item.project) === -1) projects.push(item.project);
      });

      var bar = document.getElementById('filterBar');
      bar.innerHTML = '';
      projects.forEach(function (p) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-btn' + (p === currentFilter ? ' active' : '');
        btn.textContent = p;
        btn.addEventListener('click', function () {
          currentFilter = p;
          renderFilterBar();
          render();
        });
        bar.appendChild(btn);
      });
    }

    var currentPage = 1;
    var hasMorePages = false;
    var loadMoreBtn = document.getElementById('loadMoreBtn');

    // page: 몇 번째 페이지를 불러올지. attempt: 이 페이지를 몇 번째로
    // 시도하는 중인지(실패 시 최대 3번 자동 재시도).
    function loadFeedbackList(page, attempt) {
      if (page > 1) loadMoreBtn.textContent = '불러오는 중...';
      loadMoreBtn.disabled = true;

      fetch(GAS_URL + '?action=list&page=' + page + '&pageSize=10')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (page === 1) {
            allFeedback = data.items || [];
          } else {
            allFeedback = allFeedback.concat(data.items || []);
          }
          hasMorePages = !!data.hasMore;
          currentPage = page;

          renderFilterBar();
          render();

          loadMoreBtn.disabled = false;
          loadMoreBtn.textContent = '더 보기';
          loadMoreBtn.style.display = hasMorePages ? 'block' : 'none';

          // 첫 페이지를 성공적으로 불러왔으면, 전체 화면 로딩 표시를 걷어냅니다.
          if (page === 1) {
            document.getElementById('pageLoadingOverlay').style.display = 'none';
          }
        })
        .catch(function () {
          if (attempt < 3) {
            if (page === 1) {
              document.querySelector('#pageLoadingOverlay .loading-text').textContent =
                '불러오는 중... (재시도 ' + attempt + '/3)';
            }
            setTimeout(function () {
              loadFeedbackList(page, attempt + 1);
            }, 800);
          } else {
            if (page === 1) {
              document.getElementById('pageLoadingOverlay').style.display = 'none';
            }
            document.getElementById('empty').textContent =
              '데이터를 불러오지 못했습니다. 새로고침해 주세요.';
            document.getElementById('empty').style.display = 'block';
            loadMoreBtn.disabled = false;
            loadMoreBtn.textContent = '더 보기';
          }
        });
    }

    loadMoreBtn.addEventListener('click', function () {
      loadFeedbackList(currentPage + 1, 1);
    });

    loadFeedbackList(1, 1);

    document.getElementById('deleteSelectedBtn').addEventListener('click', function () {
      var count = selectedRows.size;
      if (count === 0) return;
      if (!confirm(count + '개 항목을 삭제할까요? 되돌릴 수 없습니다.')) return;

      var btn = this;
      btn.disabled = true;
      btn.textContent = '삭제 중...';

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ type: 'deleteFeedback', rowIndexes: Array.from(selectedRows) })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          btn.disabled = false;
          btn.textContent = '선택 삭제';
          if (data && data.ok) {
            // 화면에서도 지워진 항목들을 걸러내고 다시 그립니다(새로고침 없이 즉시 반영).
            allFeedback = allFeedback.filter(function (item) { return !selectedRows.has(item.rowIndex); });
            selectedRows.clear();
            updateSelectionBar();
            renderFilterBar();
            render();
          } else {
            alert('삭제 실패: ' + (data && data.error ? data.error : '알 수 없는 오류'));
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = '선택 삭제';
          alert('삭제 중 오류가 발생했습니다.');
        });
    });
  </script>
</body>
</html>
