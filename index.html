<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발자콘솔</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; }
  h1 { font-size: 18px; margin: 0 0 16px; }

  /* 프로젝트별 필터 버튼들 */
  #filterBar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #ccc; background: #fff; color: #1F2A24; font-size: 13px; cursor: pointer; font-family: inherit; -webkit-appearance: none; appearance: none; }
  .filter-btn.active { background: #2F6F5E; border-color: #2F6F5E; color: #fff; font-weight: 600; }

  /* 한 줄 목록 레이아웃: 프로젝트 태그 - 내용 - 시간 - 버튼들이 가로로
     나란히 배치됩니다. 내용이 길면 "..."으로 줄여서 한 줄을 유지합니다. */
  .feedback-card {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid #eee; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 6px;
  }
  .feedback-card.resolved { opacity: 0.5; }
  .project-tag {
    flex-shrink: 0; padding: 3px 10px; border-radius: 999px;
    background: #EAF2EE; color: #2F6F5E; font-size: 12px; font-weight: 600;
  }
  .feedback-message {
    flex: 1; min-width: 0; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .feedback-time { flex-shrink: 0; font-size: 12px; color: #999; }
  .feedback-screenshot { max-width: 100%; border-radius: 8px; border: 1px solid #eee; margin-bottom: 10px; display: block; }

  .screenshot-loading { font-size: 12px; color: #999; padding: 8px 0; }
  /* 버튼 3개(캡처/복사/해결)의 너비를 고정해서, 여러 줄에 걸쳐 나열됐을 때
     세로로도 정렬된 열처럼 보이게 합니다. */
  .feedback-actions { flex-shrink: 0; display: flex; gap: 6px; }
  .feedback-actions button {
    width: 76px; box-sizing: border-box;
    padding: 6px 0; border-radius: 8px; border: 1px solid #ccc;
    background: #fff; font-size: 12px; cursor: pointer;
    font-family: inherit; -webkit-appearance: none; appearance: none;
    white-space: nowrap; text-align: center;
  }
  .resolve-btn.is-resolved { background: #2F6F5E; color: #fff; border-color: #2F6F5E; }
  #empty { font-size: 13px; color: #999; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
  <h1>개발자콘솔 — 피드백 목록</h1>

  <div id="filterBar"></div>

  <div id="list"></div>
  <div id="empty">불러오는 중...</div>
  <button type="button" id="loadMoreBtn" style="display:none; width:100%; padding:12px; margin-top:8px; border-radius:10px; border:1px solid #ccc; background:#fff; font-size:14px; color:#555; cursor:pointer; font-family:inherit; -webkit-appearance:none; appearance:none;">더 보기</button>

  <script>
    // ▼▼ 개발자콘솔 GAS 웹 앱의 실제 exec 주소로 바꿔주세요 ▼▼
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyaPRuDlrSFI9pEkC7lluAGI3ql-pnBRuLRGGt5L4ZHgXabZYau251ClzYyHPahRgZB/exec';

    var allFeedback = [];
    var currentFilter = '전체';

    function render() {
      var listEl = document.getElementById('list');
      var emptyEl = document.getElementById('empty');
      listEl.innerHTML = '';

      var filtered = currentFilter === '전체'
        ? allFeedback
        : allFeedback.filter(function (f) { return f.project === currentFilter; });

      if (filtered.length === 0) {
        emptyEl.textContent = '해당하는 피드백이 없습니다.';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      filtered.forEach(function (item) {
        var isResolved = item.status === '해결';
        var card = document.createElement('div');
        card.className = 'feedback-card' + (isResolved ? ' resolved' : '');

        var timeStr = new Date(item.time).toLocaleString('ko-KR');

        // 클립보드로 복사할 때 쓸 정리된 텍스트입니다.
        // Claude에게 그대로 붙여넣으면 맥락 파악이 되도록 만듭니다.
        var copyText = '[' + item.project + '] ' + timeStr + '\n' + item.message +
          (item.screenshot ? '\n캡처: ' + item.screenshot : '') +
          (item.page ? '\n페이지: ' + item.page : '');

        var html = '<span class="project-tag">' + item.project + '</span>' +
          '<span class="feedback-message"></span>' +
          '<span class="feedback-time">' + timeStr + '</span>' +
          '<div class="feedback-actions">' +
          (item.screenshot
            ? '<button type="button" class="screenshot-toggle-btn" data-fileid="' + item.screenshot + '">🖼 캡처</button>'
            : '<span style="width:76px;"></span>') +
          '<button type="button" class="copy-btn">📋 복사</button>' +
          '<button type="button" class="resolve-btn' + (isResolved ? ' is-resolved' : '') + '">' + (isResolved ? '✓ 해결됨' : '해결') + '</button>' +
          '</div>';

        card.innerHTML = html;
        // 메시지는 innerHTML이 아니라 textContent로 넣어서, 사용자가 입력한 글에
        // 우연히 HTML 태그 같은 문자가 섞여 있어도 그대로 안전하게 표시되게 합니다.
        card.querySelector('.feedback-message').textContent = item.message;

        card.querySelector('.copy-btn').addEventListener('click', function () {
          navigator.clipboard.writeText(copyText).then(function () {
            var btn = card.querySelector('.copy-btn');
            var original = btn.textContent;
            btn.textContent = '복사됨!';
            setTimeout(function () { btn.textContent = original; }, 1200);
          });
        });

        // 한 줄 레이아웃이라, 캡처 이미지가 펼쳐질 자리를 카드 바로 아래에
        // 별도로 만들어서 필요할 때만 넣어줍니다(카드 자체는 항상 한 줄 유지).
        if (item.screenshot) {
          var screenshotRow = document.createElement('div');
          screenshotRow.className = 'screenshot-container';
          screenshotRow.style.marginBottom = '6px';
          card.insertAdjacentElement('afterend', screenshotRow);
        }

        card.querySelector('.resolve-btn').addEventListener('click', function () {
          var btn = card.querySelector('.resolve-btn');
          var originalText = btn.textContent;
          // 누른 즉시 "처리 중..."으로 바꾸고, 다시 못 누르게 잠급니다.
          // 이렇게 하면 서버 응답이 늦어도 "눌렸다"는 게 바로 느껴집니다.
          btn.textContent = '처리 중...';
          btn.disabled = true;

          var newResolved = !isResolved;
          fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ type: 'resolve', rowIndex: item.rowIndex, resolved: newResolved })
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data && data.ok) {
                item.status = newResolved ? '해결' : '미해결';
                render(); // 성공하면 목록 전체가 다시 그려지면서 버튼도 정상 상태로 돌아갑니다.
              } else {
                // 실패했으면 원래 글씨로 되돌리고 다시 누를 수 있게 합니다.
                btn.textContent = originalText;
                btn.disabled = false;
                alert('처리에 실패했습니다: ' + (data && data.error ? data.error : '알 수 없는 오류'));
              }
            })
            .catch(function () {
              btn.textContent = originalText;
              btn.disabled = false;
              alert('처리 중 오류가 발생했습니다.');
            });
        });

        // "🖼 캡처 보기" 버튼은 처음 눌렀을 때만 실제 이미지를 불러옵니다.
        // 두 번째 클릭부터는 이미 불러온 이미지를 접었다 펼치기만 합니다
        // (다시 불러오지 않아서, 클릭할 때마다 매번 로딩이 걸리지 않습니다).
        var toggleBtn = card.querySelector('.screenshot-toggle-btn');
        if (toggleBtn) {
          var screenshotLoaded = false;
          var container = screenshotRow;
          toggleBtn.addEventListener('click', function () {
            var isOpen = container.style.display === 'block';
            if (isOpen) {
              container.style.display = 'none';
              toggleBtn.textContent = '🖼 캡처';
              return;
            }

            container.style.display = 'block';
            toggleBtn.textContent = '🖼 접기';

            if (!screenshotLoaded) {
              // 캡처 원본 자체가 이미 화면의 60% 크기로 고정되어 저장되기 때문에,
              // 더 큰 사이즈를 요청해도 원본보다 커질 수 없습니다. 그래서 "더 크게
              // 보기"용 두 번째 클릭은 의미가 없어 없앴고, 처음 볼 때부터 바로
              // 이 용도로 쓸 수 있는 가장 큰 사이즈(w1600)로 한 번만 보여줍니다.
              var fileId = toggleBtn.getAttribute('data-fileid');
              var imgSrc = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1600';
              container.innerHTML = '<div class="screenshot-loading">불러오는 중...</div>';

              var img = new Image();
              img.onload = function () {
                container.innerHTML = '<img class="feedback-screenshot" src="' + imgSrc + '">';
              };
              img.onerror = function () {
                container.innerHTML = '<div class="screenshot-loading">이미지를 불러오지 못했습니다.</div>';
              };
              img.src = imgSrc;

              screenshotLoaded = true;
            }
          });
        }

        listEl.appendChild(card);
        if (item.screenshot) {
          listEl.appendChild(screenshotRow);
        }
      });
    }

    function renderFilterBar() {
      var projects = ['전체'];
      allFeedback.forEach(function (item) {
        if (projects.indexOf(item.project) === -1) projects.push(item.project);
      });

      var bar = document.getElementById('filterBar');
      bar.innerHTML = '';
      projects.forEach(function (p) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-btn' + (p === currentFilter ? ' active' : '');
        btn.textContent = p;
        btn.addEventListener('click', function () {
          currentFilter = p;
          renderFilterBar();
          render();
        });
        bar.appendChild(btn);
      });
    }

    var currentPage = 1;
    var hasMorePages = false;
    var loadMoreBtn = document.getElementById('loadMoreBtn');

    // page: 몇 번째 페이지를 불러올지. attempt: 이 페이지를 몇 번째로
    // 시도하는 중인지(실패 시 최대 3번 자동 재시도).
    function loadFeedbackList(page, attempt) {
      if (page > 1) loadMoreBtn.textContent = '불러오는 중...';
      loadMoreBtn.disabled = true;

      fetch(GAS_URL + '?action=list&page=' + page + '&pageSize=10')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (page === 1) {
            allFeedback = data.items || [];
          } else {
            allFeedback = allFeedback.concat(data.items || []);
          }
          hasMorePages = !!data.hasMore;
          currentPage = page;

          renderFilterBar();
          render();

          loadMoreBtn.disabled = false;
          loadMoreBtn.textContent = '더 보기';
          loadMoreBtn.style.display = hasMorePages ? 'block' : 'none';
        })
        .catch(function () {
          if (attempt < 3) {
            document.getElementById('empty').textContent =
              '불러오는 중... (재시도 ' + attempt + '/3)';
            setTimeout(function () {
              loadFeedbackList(page, attempt + 1);
            }, 800);
          } else {
            document.getElementById('empty').textContent =
              '데이터를 불러오지 못했습니다. 새로고침해 주세요.';
            loadMoreBtn.disabled = false;
            loadMoreBtn.textContent = '더 보기';
          }
        });
    }

    loadMoreBtn.addEventListener('click', function () {
      loadFeedbackList(currentPage + 1, 1);
    });

    loadFeedbackList(1, 1);
  </script>
</body>
</html>
