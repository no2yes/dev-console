<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발자콘솔</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #F7F5EF; color: #1F2A24; }
  h1 { font-size: 18px; margin: 0 0 16px; }

  /* 프로젝트별 필터 버튼들 */
  #filterBar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #ccc; background: #fff; color: #1F2A24; font-size: 13px; cursor: pointer; font-family: inherit; -webkit-appearance: none; appearance: none; }
  .filter-btn.active { background: #2F6F5E; border-color: #2F6F5E; color: #fff; font-weight: 600; }

  .feedback-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .feedback-card.resolved { opacity: 0.5; }
  .feedback-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .project-tag { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #EAF2EE; color: #2F6F5E; font-size: 12px; font-weight: 600; }
  .feedback-time { font-size: 12px; color: #999; }
  .feedback-message { font-size: 14px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px; }
  .feedback-screenshot { max-width: 100%; border-radius: 8px; border: 1px solid #eee; margin-bottom: 10px; display: block; }
  .screenshot-toggle-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 12px; color: #555; cursor: pointer; margin-bottom: 10px; font-family: inherit; -webkit-appearance: none; appearance: none; }
  .screenshot-loading { font-size: 12px; color: #999; padding: 8px 0; }
  .feedback-actions { display: flex; gap: 8px; }
  .feedback-actions button { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 12px; cursor: pointer; font-family: inherit; -webkit-appearance: none; appearance: none; }
  .resolve-btn.is-resolved { background: #2F6F5E; color: #fff; border-color: #2F6F5E; }
  #empty { font-size: 13px; color: #999; margin-top: 20px; text-align: center; }
</style>
</head>
<body>
  <h1>개발자콘솔 — 피드백 목록</h1>

  <div id="filterBar"></div>

  <div id="list"></div>
  <div id="empty">불러오는 중...</div>

  <script>
    // ▼▼ 개발자콘솔 GAS 웹 앱의 실제 exec 주소로 바꿔주세요 ▼▼
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbyaPRuDlrSFI9pEkC7lluAGI3ql-pnBRuLRGGt5L4ZHgXabZYau251ClzYyHPahRgZB/exec';

    var allFeedback = [];
    var currentFilter = '전체';

    function render() {
      var listEl = document.getElementById('list');
      var emptyEl = document.getElementById('empty');
      listEl.innerHTML = '';

      var filtered = currentFilter === '전체'
        ? allFeedback
        : allFeedback.filter(function (f) { return f.project === currentFilter; });

      if (filtered.length === 0) {
        emptyEl.textContent = '해당하는 피드백이 없습니다.';
        emptyEl.style.display = 'block';
        return;
      }
      emptyEl.style.display = 'none';

      filtered.forEach(function (item) {
        var isResolved = item.status === '해결';
        var card = document.createElement('div');
        card.className = 'feedback-card' + (isResolved ? ' resolved' : '');

        var timeStr = new Date(item.time).toLocaleString('ko-KR');

        // 클립보드로 복사할 때 쓸 정리된 텍스트입니다.
        // Claude에게 그대로 붙여넣으면 맥락 파악이 되도록 만듭니다.
        var copyText = '[' + item.project + '] ' + timeStr + '\n' + item.message +
          (item.screenshot ? '\n캡처: ' + item.screenshot : '') +
          (item.page ? '\n페이지: ' + item.page : '');

        var html = '<div class="feedback-top">' +
          '<span class="project-tag">' + item.project + '</span>' +
          '<span class="feedback-time">' + timeStr + '</span>' +
          '</div>' +
          '<div class="feedback-message"></div>';

        if (item.screenshot) {
          // 캡처를 목록에 한꺼번에 다 불러오면 로딩이 오래 걸리고 화면도
          // 정신없어지므로, 평소엔 작은 "🖼 캡처 보기" 버튼만 보여주고
          // 눌렀을 때만 실제 이미지를 불러옵니다(지연 로딩).
          html += '<button type="button" class="screenshot-toggle-btn" data-fileid="' + item.screenshot + '">🖼 캡처 보기</button>' +
            '<div class="screenshot-container"></div>';
        }

        html += '<div class="feedback-actions">' +
          '<button type="button" class="copy-btn">📋 복사</button>' +
          '<button type="button" class="resolve-btn' + (isResolved ? ' is-resolved' : '') + '">' + (isResolved ? '✓ 해결됨' : '해결 표시') + '</button>' +
          '</div>';

        card.innerHTML = html;
        // 메시지는 innerHTML이 아니라 textContent로 넣어서, 사용자가 입력한 글에
        // 우연히 HTML 태그 같은 문자가 섞여 있어도 그대로 안전하게 표시되게 합니다.
        card.querySelector('.feedback-message').textContent = item.message;

        card.querySelector('.copy-btn').addEventListener('click', function () {
          navigator.clipboard.writeText(copyText).then(function () {
            var btn = card.querySelector('.copy-btn');
            var original = btn.textContent;
            btn.textContent = '복사됨!';
            setTimeout(function () { btn.textContent = original; }, 1200);
          });
        });

        card.querySelector('.resolve-btn').addEventListener('click', function () {
          var newResolved = !isResolved;
          fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ type: 'resolve', rowIndex: item.rowIndex, resolved: newResolved })
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data && data.ok) {
                item.status = newResolved ? '해결' : '미해결';
                render();
              }
            });
        });

        // "🖼 캡처 보기" 버튼은 처음 눌렀을 때만 실제 이미지를 불러옵니다.
        // 두 번째 클릭부터는 이미 불러온 이미지를 접었다 펼치기만 합니다
        // (다시 불러오지 않아서, 클릭할 때마다 매번 로딩이 걸리지 않습니다).
        var toggleBtn = card.querySelector('.screenshot-toggle-btn');
        if (toggleBtn) {
          var screenshotLoaded = false;
          var container = card.querySelector('.screenshot-container');
          toggleBtn.addEventListener('click', function () {
            var isOpen = container.style.display === 'block';
            if (isOpen) {
              container.style.display = 'none';
              toggleBtn.textContent = '🖼 캡처 보기';
              return;
            }

            container.style.display = 'block';
            toggleBtn.textContent = '🖼 캡처 접기';

            if (!screenshotLoaded) {
              // 캡처 원본 자체가 이미 화면의 60% 크기로 고정되어 저장되기 때문에,
              // 더 큰 사이즈를 요청해도 원본보다 커질 수 없습니다. 그래서 "더 크게
              // 보기"용 두 번째 클릭은 의미가 없어 없앴고, 처음 볼 때부터 바로
              // 이 용도로 쓸 수 있는 가장 큰 사이즈(w1600)로 한 번만 보여줍니다.
              var fileId = toggleBtn.getAttribute('data-fileid');
              var imgSrc = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1600';
              container.innerHTML = '<div class="screenshot-loading">불러오는 중...</div>';

              var img = new Image();
              img.onload = function () {
                container.innerHTML = '<img class="feedback-screenshot" src="' + imgSrc + '">';
              };
              img.onerror = function () {
                container.innerHTML = '<div class="screenshot-loading">이미지를 불러오지 못했습니다.</div>';
              };
              img.src = imgSrc;

              screenshotLoaded = true;
            }
          });
        }

        listEl.appendChild(card);
      });
    }

    function renderFilterBar() {
      var projects = ['전체'];
      allFeedback.forEach(function (item) {
        if (projects.indexOf(item.project) === -1) projects.push(item.project);
      });

      var bar = document.getElementById('filterBar');
      bar.innerHTML = '';
      projects.forEach(function (p) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-btn' + (p === currentFilter ? ' active' : '');
        btn.textContent = p;
        btn.addEventListener('click', function () {
          currentFilter = p;
          renderFilterBar();
          render();
        });
        bar.appendChild(btn);
      });
    }

    // 목록 불러오기를 함수로 분리해서, 실패했을 때 재시도할 수 있게 합니다.
    // attempt: 지금이 몇 번째 시도인지 (1부터 시작, 최대 3번까지 시도합니다)
    function loadFeedbackList(attempt) {
      fetch(GAS_URL + '?action=list')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          allFeedback = data || [];
          renderFilterBar();
          render();
        })
        .catch(function () {
          // 구글 Apps Script는 가끔 응답 중계 단계에서 일시적으로 실패하는
          // 경우가 있어서(저희 데이터나 코드 문제가 아닙니다), 최대 3번까지
          // 자동으로 다시 시도합니다.
          if (attempt < 3) {
            document.getElementById('empty').textContent =
              '불러오는 중... (재시도 ' + attempt + '/3)';
            setTimeout(function () {
              loadFeedbackList(attempt + 1);
            }, 800);
          } else {
            document.getElementById('empty').textContent =
              '데이터를 불러오지 못했습니다. 새로고침해 주세요.';
          }
        });
    }

    loadFeedbackList(1);
  </script>
</body>
</html>
